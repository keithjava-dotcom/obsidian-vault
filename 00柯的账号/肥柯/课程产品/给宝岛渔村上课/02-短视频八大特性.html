<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短视频八大特性</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f5f4;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;display:flex;justify-content:center;padding:40px 20px}
.card{max-width:900px;width:100%;background:#fff;border-radius:16px;padding:32px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{text-align:center;font-size:24px;color:#1a1a1a;margin-bottom:4px}
.sub{text-align:center;color:#888;font-size:14px;margin-bottom:20px}
svg{width:100%;height:auto;display:block}
.tip{text-align:center;color:#666;font-size:13px;margin-top:16px;padding:12px;background:#f0f9ff;border-radius:10px;border-left:3px solid #3B82F6}
</style>
</head>
<body>
<div class="card">
<h1>短视频八大特性</h1>
<p class="sub">内容自检标准 · 满足3-4个即可，1个极致也行</p>

<svg viewBox="0 0 850 750" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="sh" x="-6%" y="-6%" width="112%" height="112%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
  </filter>
</defs>

<!-- 中心圆 -->
<circle cx="425" cy="130" r="48" fill="#1a1a1a" filter="url(#sh)"/>
<text x="425" y="120" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">短 视 频</text>
<text x="425" y="142" text-anchor="middle" fill="#aaa" font-size="12">八 大 特 性</text>

<!-- 连接线 -->
<g fill="none" stroke="#bbb" stroke-width="1.5">
  <line x1="425" y1="178" x2="425" y2="208"/>
  <line x1="425" y1="208" x2="140" y2="208"/>
  <line x1="425" y1="208" x2="300" y2="208"/>
  <line x1="425" y1="208" x2="550" y2="208"/>
  <line x1="425" y1="208" x2="710" y2="208"/>
  
  <line x1="425" y1="178" x2="425" y2="248"/>
  <line x1="425" y1="248" x2="140" y2="248"/>
  <line x1="425" y1="248" x2="300" y2="248"/>
  <line x1="425" y1="248" x2="550" y2="248"/>
  <line x1="425" y1="248" x2="710" y2="248"/>
</g>

<!-- 第1行：①②③④ -->
<!-- ① 高效性 -->
<rect x="40" y="220" width="190" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#sh)"/>
<text x="135" y="248" text-anchor="middle" fill="#1D4ED8" font-size="15" font-weight="700">① 高效性</text>
<text x="135" y="268" text-anchor="middle" fill="#3B82F6" font-size="11">信息分散效率高</text>
<text x="135" y="284" text-anchor="middle" fill="#3B82F6" font-size="11">30秒=15个信息点</text>
<text x="135" y="300" text-anchor="middle" fill="#3B82F6" font-size="11">2分钟=30个点</text>

<!-- ② 时效性 -->
<rect x="200" y="220" width="190" height="90" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5" filter="url(#sh)"/>
<text x="295" y="248" text-anchor="middle" fill="#15803D" font-size="15" font-weight="700">② 时效性</text>
<text x="295" y="268" text-anchor="middle" fill="#22C55E" font-size="11">观众只看新鲜东西</text>
<text x="295" y="284" text-anchor="middle" fill="#22C55E" font-size="11">越新越好</text>
<text x="295" y="300" text-anchor="middle" fill="#22C55E" font-size="11">当场收集素材</text>

<!-- ③ 客厅任意 -->
<rect x="415" y="220" width="190" height="90" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5" filter="url(#sh)"/>
<text x="510" y="248" text-anchor="middle" fill="#C2410C" font-size="15" font-weight="700">③ 客厅任意</text>
<text x="510" y="268" text-anchor="middle" fill="#F97316" font-size="11">用户状态不可预测</text>
<text x="510" y="284" text-anchor="middle" fill="#F97316" font-size="11">2秒留住</text>
<text x="510" y="300" text-anchor="middle" fill="#F97316" font-size="11">5秒值得留</text>

<!-- ④ 反差 -->
<rect x="615" y="220" width="190" height="90" rx="10" fill="#FDF2F8" stroke="#EC4899" stroke-width="1.5" filter="url(#sh)"/>
<text x="710" y="248" text-anchor="middle" fill="#BE185D" font-size="15" font-weight="700">④ 反差 RELATE</text>
<text x="710" y="268" text-anchor="middle" fill="#EC4899" font-size="11">看似A实则在干B</text>
<text x="710" y="284" text-anchor="middle" fill="#EC4899" font-size="11">大叔装萝莉说话</text>
<text x="710" y="300" text-anchor="middle" fill="#EC4899" font-size="11">短视频非常流行</text>

<!-- 中轴线连接到第2行 -->
<line x1="425" y1="310" x2="425" y2="340" stroke="#bbb" stroke-width="1.5"/>

<g fill="none" stroke="#bbb" stroke-width="1.5">
  <line x1="425" y1="340" x2="140" y2="340"/>
  <line x1="425" y1="340" x2="300" y2="340"/>
  <line x1="425" y1="340" x2="550" y2="340"/>
  <line x1="425" y1="340" x2="710" y2="340"/>
</g>

<!-- 第2行：⑤⑥⑦⑧ -->
<!-- ⑤ 持续性 -->
<rect x="40" y="352" width="190" height="90" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5" filter="url(#sh)"/>
<text x="135" y="380" text-anchor="middle" fill="#6D28D9" font-size="15" font-weight="700">⑤ 持续性</text>
<text x="135" y="400" text-anchor="middle" fill="#8B5CF6" font-size="11">内容要保证持续输出</text>
<text x="135" y="420" text-anchor="middle" fill="#8B5CF6" font-size="11">不要拍一条就断更</text>
<text x="135" y="436" text-anchor="middle" fill="#8B5CF6" font-size="11">选题要有延续性</text>

<!-- ⑥ 5-7秒原则 -->
<rect x="200" y="352" width="190" height="90" rx="10" fill="#FEF9C3" stroke="#EAB308" stroke-width="1.5" filter="url(#sh)"/>
<text x="295" y="380" text-anchor="middle" fill="#A16207" font-size="15" font-weight="700">⑥ 5-7秒原则</text>
<text x="295" y="400" text-anchor="middle" fill="#EAB308" font-size="11">每5-7秒一个新点</text>
<text x="295" y="420" text-anchor="middle" fill="#EAB308" font-size="11">像刷视频一样节奏</text>
<text x="295" y="436" text-anchor="middle" fill="#EAB308" font-size="11">观众持续被刺激</text>

<!-- ⑦ 多轨道性 -->
<rect x="415" y="352" width="190" height="90" rx="10" fill="#ECFDF5" stroke="#14B8A6" stroke-width="1.5" filter="url(#sh)"/>
<text x="510" y="380" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="700">⑦ 多轨道性</text>
<text x="510" y="400" text-anchor="middle" fill="#14B8A6" font-size="11">主画面+花字+音乐</text>
<text x="510" y="420" text-anchor="middle" fill="#14B8A6" font-size="11">+音效+提示+白噪音</text>
<text x="510" y="436" text-anchor="middle" fill="#14B8A6" font-size="11">轨道越多质量越高</text>

<!-- ⑧ 长视频趋势 -->
<rect x="615" y="352" width="190" height="90" rx="10" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5" filter="url(#sh)"/>
<text x="710" y="380" text-anchor="middle" fill="#BE123C" font-size="15" font-weight="700">⑧ 长视频趋势</text>
<text x="710" y="400" text-anchor="middle" fill="#F43F5E" font-size="11">2025后平台大力推</text>
<text x="710" y="420" text-anchor="middle" fill="#F43F5E" font-size="11">10-20分钟有奖励</text>
<text x="710" y="436" text-anchor="middle" fill="#F43F5E" font-size="11">留观+创收双赢</text>

<!-- 底部自检方法 -->
<rect x="100" y="490" width="650" height="120" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" filter="url(#sh)"/>
<text x="425" y="520" text-anchor="middle" fill="#334155" font-size="16" font-weight="700">✅ 自检方法</text>

<text x="425" y="548" text-anchor="middle" fill="#64748B" font-size="13">拍完一条视频 → 对照八大特性挨个检查</text>
<text x="425" y="570" text-anchor="middle" fill="#64748B" font-size="13">3-4个达标 → 合格 · 某特性极致 → 优秀 · 0-2个 → 重拍</text>
<text x="425" y="592" text-anchor="middle" fill="#64748B" font-size="13">清单式内容天然契合高效性 + 5-7秒原则 + 多轨道性</text>

<div class="tip">💡 初学建议：先盯紧①高效性+②时效性+③客厅任意+⑥5-7秒原则，这四个是基础</div>
</svg>
</div>
</body>
</html>
