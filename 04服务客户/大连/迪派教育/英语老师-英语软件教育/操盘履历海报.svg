      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="40%" stop-color="#141b23"/>
      <stop offset="100%" stop-color="#0f1520"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardHL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(16,185,129,0.2)"/><stop offset="100%" stop-color="rgba(16,185,129,0.05)"/>
    </linearGradient>
    <linearGradient id="cardHL2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(139,92,246,0.2)"/><stop offset="100%" stop-color="rgba(139,92,246,0.05)"/>
